
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Проект 868</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#10141d;color:#e8edf5;font:16px Arial,sans-serif}
main{max-width:720px;margin:auto;padding:20px}
h1{text-align:center;color:#d9e4ff}
.panel{background:#1a2230;padding:20px;border-radius:14px;margin:16px 0}
input,button{width:100%;padding:13px;margin:7px 0;border-radius:8px;border:1px solid #39465c;font-size:16px}
input{background:#101722;color:white}
button{background:#526fe0;color:white;border:0;font-weight:bold;cursor:pointer}
button.secondary{background:#303b4e}
#chat{display:none}
#messages{height:55vh;overflow-y:auto;background:#101722;padding:12px;border-radius:10px}
.msg{padding:10px;margin:8px 0;background:#222d3e;border-radius:8px;overflow-wrap:anywhere}
.msg small{display:block;color:#aab8d0;margin-bottom:5px}
#status{color:#aab8d0;text-align:center;min-height:24px}
</style>
</head>
<body>
<main>
<h1>Проект 868</h1>
<p id="status">Подключение...</p>

<section id="auth" class="panel">
<h2>Вход</h2>
<input id="email" type="email" placeholder="Электронная почта">
<input id="password" type="password" placeholder="Пароль">
<button id="login">Войти</button>

<hr>

<h2>Регистрация</h2>
<input id="username" placeholder="Имя пользователя">
<input id="invite" placeholder="Код приглашения">
<button id="signup">Создать аккаунт</button>
</section>

<section id="chat" class="panel">
<div style="display:flex;gap:10px;align-items:center">
<h2 style="flex:1">Общий чат</h2>
<button id="logout" class="secondary" style="width:auto">Выйти</button>
</div>
<div id="messages"></div>
<form id="sendform">
<input id="message" placeholder="Написать сообщение..." maxlength="2000" required>
<button type="submit">Отправить</button>
</form>
</section>
</main>

<script>
const SUPABASE_URL = "https://bpfovfvadhbpjurpihiz.supabase.co";
const SUPABASE_KEY = "sb_publishable_yzsPqsN_fcbY5HRBRWnnAg_TebOOGxR";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const status = text => $("status").textContent = text;

function showChat(user) {
  $("auth").style.display = user ? "none" : "block";
  $("chat").style.display = user ? "block" : "none";
  if (user) {
    status("Ты вошёл в мессенджер");
    loadMessages();
  } else {
    status("Войди или зарегистрируйся по приглашению");
  }
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

async function loadMessages() {
  const {data, error} = await client
    .from("messages")
    .select("id, username, content, created_at")
    .order("created_at", {ascending:true})
    .limit(100);

  if (error) {
    status("Ошибка загрузки сообщений: " + error.message);
    return;
  }

  $("messages").innerHTML = data.map(m => `
    <div class="msg">
      <small>${escapeHtml(m.username)} · ${new Date(m.created_at).toLocaleString()}</small>
      ${escapeHtml(m.content)}
    </div>
  `).join("");

  $("messages").scrollTop = $("messages").scrollHeight;
}

$("login").onclick = async () => {
  const {error} = await client.auth.signInWithPassword({
    email: $("email").value.trim(),
    password: $("password").value
  });
  if (error) status(error.message);
};

$("signup").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  const username = $("username").value.trim();
  const invite = $("invite").value.trim();

  if (!email || !password || !username || !invite) {
    status("Заполни все поля регистрации");
    return;
  }

  if (password.length < 8) {
    status("Пароль должен быть не короче 8 символов");
    return;
  }

  status("Создаём аккаунт...");

  const {data, error} = await client.auth.signUp({
    email,
    password,
    options: {
      data: {
        username: username,
        invite_code: invite
      }
    }
  });

  if (error) {
    status("Регистрация не удалась: " + error.message);
  } else if (data.session) {
    status("Аккаунт создан!");
  } else {
    status("Аккаунт создан. Проверь почту для подтверждения.");
  }
};

$("logout").onclick = async () => {
  await client.auth.signOut();
};

$("sendform").onsubmit = async event => {
  event.preventDefault();

  const {data:{user}} = await client.auth.getUser();
  if (!user) return;

  const content = $("message").value.trim();
  if (!content) return;

  const username = user.user_metadata.username || user.email;

  const {error} = await client.from("messages").insert({
    user_id: user.id,
    username,
    content
  });

  if (error) {
    status("Не удалось отправить: " + error.message);
  } else {
    $("message").value = "";
  }
};

client.auth.onAuthStateChange((_event, session) => {
  showChat(session?.user || null);
});

(async () => {
  const {data:{session}} = await client.auth.getSession();
  showChat(session?.user || null);

  client
    .channel("messages-live")
    .on("postgres_changes", {
      event:"INSERT",
      schema:"public",
      table:"messages"
    }, () => loadMessages())
    .subscribe();
})();
</script>
</body>
</html>
